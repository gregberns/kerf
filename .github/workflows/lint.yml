# lint.yml — per-PR / per-push lint workflow.
#
# Plan 024 (CI Foundation), bead kerf-l51g. Spec: specs/testing.md § "CI Strategy".
#
# Scope: run `go vet ./...` then `golangci-lint run` against the configured
# preset in `.golangci.yml`. PR-blocking (plan §"Open questions" Q1 resolved
# to blocking). Any finding fails the job — the baseline must stay green.
#
# Out of scope (separate beads):
#   - test/race/cover (kerf-k2qb, see test.yml)
#   - coverage ratchet (kerf-9vkt)
#   - fuzz nightly  (kerf-3oyg)

name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      # `go vet` runs implicitly under `go test` in test.yml, but we run it
      # here too so a lint-only PR (e.g. .golangci.yml tweak) still surfaces
      # vet failures distinctly.
      - name: go vet
        run: go vet ./...

      # Pinned action version; preset lives in .golangci.yml at repo root.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m
