# test.yml — per-PR / per-push test workflow.
#
# Plan 024 (CI Foundation), bead kerf-k2qb. Spec: specs/testing.md § "CI Strategy".
#
# Scope: a single Go version on ubuntu-latest, install pinned `bd`, then run
# `go vet` and `go test -race -cover ./...`. Any non-zero step fails the job.
#
# Out of scope for this workflow (separate downstream beads):
#   - lint (kerf-l51g)              - coverage ratchet (kerf-9vkt)
#   - fuzz nightly (kerf-3oyg)      - README badge (kerf-oy53)
#
# `bd` is pinned via .github/bd-version so version bumps are a one-line PR.

name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: go test -race -cover
    runs-on: ubuntu-latest

    steps:
      # 1. Source checkout.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Toolchain. Single Go version matching go.mod (1.26.1). setup-go@v5
      #    enables module + build caching by default (plan §"Open questions" Q6).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      # 3. Install `bd` (beads CLI). Required by integration tests; failure
      #    here must fail the job — kerf's tests assume bd exists on PATH.
      #    Version pinned in .github/bd-version (plan Q5 resolution).
      #    Repo moved from steveyegge/beads to gastownhall/beads in 2026; we
      #    pin to the canonical current path.
      - name: Install bd (beads CLI)
        run: |
          set -euo pipefail
          BD_VERSION="$(cat .github/bd-version)"
          echo "Installing bd ${BD_VERSION}"
          go install "github.com/gastownhall/beads/cmd/bd@${BD_VERSION}"
          # GOPATH/bin should already be on PATH via setup-go; double-check.
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
          "${HOME}/go/bin/bd" --version

      # 4. Static checks. `go vet` runs implicitly under `go test` but having
      #    it as a separate step surfaces vet failures distinctly in the UI.
      - name: go vet
        run: go vet ./...

      # 5. Test with race detector and coverage. -coverprofile feeds the
      #    coverage artifact (consumed by the ratchet bead, kerf-9vkt).
      - name: go test -race -cover
        run: go test -race -cover -coverprofile=coverage.out ./...

      # 6. Upload coverage profile for downstream beads (ratchet, badge).
      #    Best-effort: if the test step failed, this is skipped automatically.
      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: error
          retention-days: 14
