# fuzz.yml — nightly fuzz workflow.
#
# Plan 024 (CI Foundation), bead kerf-3oyg. Spec: specs/testing.md § "CI Strategy"
# (fuzz row). Companion to test.yml (kerf-k2qb).
#
# Scope:
#   - Trigger: nightly cron + workflow_dispatch (manual).
#   - Discover every Fuzz* target via `go test -list ^Fuzz` per package.
#   - Run each target with -fuzztime=2m (today: 3 targets across
#     internal/codename, internal/config, internal/spec → ~6 min wall).
#   - On failure, upload the offending corpus (testdata/fuzz) as an artifact
#     for human triage. v1 does NOT auto-file a bd issue (stretch goal).
#
# Out of scope:
#   - README badge / spec pointer — owned by kerf-oy53.
#   - Auto-filing a bd issue on failure — Plan 024 OQ, deferred.
#
# Note: fuzz targets here are unit-level (no bd dependency), so we skip the
# `bd` install step that test.yml performs.

name: fuzz

on:
  # 05:00 UTC nightly. Wall time per run ~6 min today; scales linearly with
  # target count. Adjust cadence if budget becomes a concern.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    name: nightly fuzz (2m per target)
    runs-on: ubuntu-latest

    steps:
      # 1. Source checkout.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Toolchain. Match go.mod version (same as test.yml).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      # 3. Discover and run every Fuzz* target.
      #
      #    For each package, `go test -list ^Fuzz` enumerates fuzz targets;
      #    we then invoke `go test -run=^$ -fuzz=^<Name>$ -fuzztime=2m` per
      #    target. -run=^$ disables normal tests so only fuzzing happens.
      #
      #    Any target failure exits non-zero and fails the job (set -e).
      - name: Run fuzz targets (2m each)
        run: |
          set -euo pipefail
          failed=0
          # List packages that contain at least one Fuzz* function.
          pkgs="$(go test -list '^Fuzz' ./... 2>/dev/null \
                  | awk '/^Fuzz/{print pkg} /^ok|^---|^FAIL|^\?/{pkg=$2}' \
                  | sort -u || true)"
          # Fallback: if the awk dance misses anything, just walk all packages.
          if [ -z "${pkgs}" ]; then
            pkgs="$(go list ./...)"
          fi
          echo "Scanning packages for fuzz targets:"
          echo "${pkgs}"
          for pkg in ${pkgs}; do
            targets="$(go test -list '^Fuzz' "${pkg}" 2>/dev/null \
                       | grep '^Fuzz' || true)"
            for t in ${targets}; do
              echo "::group::${pkg} ${t}"
              if ! go test -run='^$' -fuzz="^${t}$" -fuzztime=2m "${pkg}"; then
                echo "FUZZ FAILURE: ${pkg} ${t}"
                failed=1
              fi
              echo "::endgroup::"
            done
          done
          exit "${failed}"

      # 4. On failure, upload any corpus entries Go wrote under testdata/fuzz.
      #    `if: failure()` ensures we only spend artifact budget on real issues.
      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 30
