# s6_late_arrivals — scripted explicit arrivals injected mid-run.
# Tests how policies absorb a burst of rework at tick 5000 and 9000.
seed: 2006
ticks: 20000
agents: 3
works:
  - {codename: amber-fox,   areas: [cli],     deps: [],            bead_count: 12}
  - {codename: bright-mole, areas: [storage], deps: [],            bead_count: 12}
  - {codename: copper-newt, areas: [queue],   deps: [amber-fox],   bead_count: 10}
  - {codename: dusty-owl,   areas: [docs],    deps: [bright-mole], bead_count: 10}
  - {codename: ember-pike,  areas: [cli, queue], deps: [copper-newt], bead_count: 8}
bead_arrivals:
  explicit:
    - {tick: 5000, work: amber-fox,   labels: [rework:true]}
    - {tick: 5000, work: amber-fox,   labels: [rework:true]}
    - {tick: 5000, work: amber-fox,   labels: [rework:true]}
    - {tick: 5000, work: bright-mole, labels: [rework:true]}
    - {tick: 5000, work: bright-mole, labels: [rework:true]}
    - {tick: 9000, work: copper-newt, labels: [rework:true]}
    - {tick: 9000, work: copper-newt, labels: [rework:true]}
    - {tick: 9000, work: dusty-owl,   labels: [rework:true]}
    - {tick: 9000, work: dusty-owl,   labels: [rework:true]}
    - {tick: 9000, work: amber-fox,   labels: [rework:true]}
agent_model:
  duration: {kind: lognormal, median_ticks: 30, sigma: 0.7}
