# s5_asymmetric_sizes — mixes tiny (3-bead) works with huge (60-bead) works.
# Tests whether momentum / fan-out gets fooled by size disparity.
seed: 2005
ticks: 30000
agents: 3
works:
  - {codename: huge-fox,    areas: [core],     deps: [],            bead_count: 60}
  - {codename: huge-mole,   areas: [storage],  deps: [],            bead_count: 60}
  - {codename: tiny-newt,   areas: [a01],      deps: [],            bead_count: 3}
  - {codename: tiny-owl,    areas: [a02],      deps: [],            bead_count: 3}
  - {codename: tiny-pike,   areas: [a03],      deps: [],            bead_count: 3}
  - {codename: tiny-quail,  areas: [a04],      deps: [],            bead_count: 3}
  - {codename: tiny-raven,  areas: [a05],      deps: [],            bead_count: 3}
  - {codename: tiny-shrew,  areas: [a06],      deps: [],            bead_count: 3}
  - {codename: med-toad,    areas: [core, a07],deps: [huge-fox],    bead_count: 15}
  - {codename: med-vole,    areas: [storage],  deps: [huge-mole],   bead_count: 15}
  - {codename: tiny-wren,   areas: [a08],      deps: [tiny-newt],   bead_count: 3}
  - {codename: tiny-yak,    areas: [a09],      deps: [tiny-owl],    bead_count: 3}
bead_arrivals:
  generator:
    rework_rate_per_tick: 0.003
    target_works: [huge-fox, huge-mole, tiny-newt, tiny-owl]
agent_model:
  duration: {kind: lognormal, median_ticks: 25, sigma: 0.9}
