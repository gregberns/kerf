# s7_diamond_layers — layered diamond DAG with high parallelism.
# Tests fan-out across multiple layers + areas overlapping.
seed: 2007
ticks: 25000
agents: 2  # saturated: halved from 5
works:
  - {codename: r-fox,   areas: [core],         deps: [],                       bead_count: 10}
  - {codename: a-mole,  areas: [cli],          deps: [r-fox],                  bead_count: 8}
  - {codename: a-newt,  areas: [storage],      deps: [r-fox],                  bead_count: 8}
  - {codename: a-owl,   areas: [queue],        deps: [r-fox],                  bead_count: 8}
  - {codename: a-pike,  areas: [docs],         deps: [r-fox],                  bead_count: 8}
  - {codename: b-quail, areas: [cli, queue],   deps: [a-mole, a-owl],          bead_count: 8}
  - {codename: b-raven, areas: [storage, docs],deps: [a-newt, a-pike],         bead_count: 8}
  - {codename: b-shrew, areas: [cli, storage], deps: [a-mole, a-newt],         bead_count: 8}
  - {codename: b-toad,  areas: [queue, docs],  deps: [a-owl, a-pike],          bead_count: 8}
  - {codename: c-vole,  areas: [release],      deps: [b-quail, b-raven],       bead_count: 10}
  - {codename: c-wren,  areas: [release],      deps: [b-shrew, b-toad],        bead_count: 10}
  - {codename: f-yak,   areas: [release, core],deps: [c-vole, c-wren],         bead_count: 12}
bead_arrivals:
  generator:
    rework_rate_per_tick: 0.004
    target_works: [r-fox, a-mole, a-newt, b-quail, b-raven]
agent_model:
  duration: {kind: lognormal, median_ticks: 25, sigma: 0.8}
