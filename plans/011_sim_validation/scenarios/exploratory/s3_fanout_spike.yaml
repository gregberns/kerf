# s3_fanout_spike — one work has many dependents. Tests fan-out scoring leverage.
# Completing root unlocks all 15 leaves; the question is whether kerf prioritizes it.
seed: 2003
ticks: 25000
agents: 4
works:
  - {codename: root-fox,    areas: [core],       deps: [],          bead_count: 14}
  - {codename: leaf01-mole, areas: [a01],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf02-newt, areas: [a02],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf03-owl,  areas: [a03],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf04-pike, areas: [a04],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf05-quail,areas: [a05],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf06-raven,areas: [a06],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf07-shrew,areas: [a07],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf08-toad, areas: [a08],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf09-vole, areas: [a09],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf10-wren, areas: [a10],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf11-yak,  areas: [a11],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf12-auk,  areas: [a12],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf13-bison,areas: [a13],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf14-crane,areas: [a14],        deps: [root-fox],  bead_count: 6}
  - {codename: leaf15-doe,  areas: [a15],        deps: [root-fox],  bead_count: 6}
  - {codename: distractor1, areas: [d01],        deps: [],          bead_count: 20}
  - {codename: distractor2, areas: [d02],        deps: [],          bead_count: 20}
bead_arrivals:
  generator:
    rework_rate_per_tick: 0.001
    target_works: [root-fox, distractor1]
agent_model:
  duration: {kind: lognormal, median_ticks: 30, sigma: 0.7}
