# adv-cascade-chain — kerf's parallelism leverage is zero on a linear chain.
#
# Hypothesis: a 15-work linear chain leaves at most 1 actionable work at any
# time (the head). All policies converge to the same dispatch order, so kerf
# has no headroom to win on wall_ticks. With 3 agents, agent_idle_pct will
# be ~67% for every policy. Predicted result: NO LOSS on completion metrics
# (kerf ~= baselines), but kerf's score evaluation cost (queue.Compute every
# `next` call) is pure overhead. This scenario isn't a loss — it's a "kerf
# offers no value here" scenario. Useful as a sanity check.
seed: 9005
ticks: 40000
agents: 3

works:
  - { codename: c-01, areas: [a], deps: [], bead_count: 4 }
  - { codename: c-02, areas: [a], deps: [c-01], bead_count: 4 }
  - { codename: c-03, areas: [a], deps: [c-02], bead_count: 4 }
  - { codename: c-04, areas: [a], deps: [c-03], bead_count: 4 }
  - { codename: c-05, areas: [a], deps: [c-04], bead_count: 4 }
  - { codename: c-06, areas: [a], deps: [c-05], bead_count: 4 }
  - { codename: c-07, areas: [a], deps: [c-06], bead_count: 4 }
  - { codename: c-08, areas: [a], deps: [c-07], bead_count: 4 }
  - { codename: c-09, areas: [a], deps: [c-08], bead_count: 4 }
  - { codename: c-10, areas: [a], deps: [c-09], bead_count: 4 }
  - { codename: c-11, areas: [a], deps: [c-10], bead_count: 4 }
  - { codename: c-12, areas: [a], deps: [c-11], bead_count: 4 }
  - { codename: c-13, areas: [a], deps: [c-12], bead_count: 4 }
  - { codename: c-14, areas: [a], deps: [c-13], bead_count: 4 }
  - { codename: c-15, areas: [a], deps: [c-14], bead_count: 4 }

bead_arrivals:
  generator:
    rework_rate_per_tick: 0.0
    target_works: [c-01]

agent_model:
  duration:
    kind: lognormal
    median_ticks: 30
    sigma: 0.8
