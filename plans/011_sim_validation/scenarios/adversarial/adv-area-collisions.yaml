# adv-area-collisions — kerf has no area-awareness in scoring, so it will
# happily dispatch two works with overlapping areas to two agents simultaneously.
#
# Hypothesis: every top-scoring work shares the `core` area. Under kerf, the
# top-2 picks frequently collide on `core`. Under FIFO-by-work with a
# round-robin tie-break the collision rate is similar, but FIFO-by-bead
# (which considers arrival order across works) actually spreads agents across
# more works. Predicted loss metric: area_collisions (kerf >= baselines).
# Note: this is more about a signal gap than weight tuning.
seed: 9004
ticks: 30000
agents: 4

works:
  - codename: w-core-1
    areas: [core, util]
    deps: []
    bead_count: 8
  - codename: w-core-2
    areas: [core, api]
    deps: []
    bead_count: 8
  - codename: w-core-3
    areas: [core, storage]
    deps: []
    bead_count: 8
  - codename: w-core-4
    areas: [core, cli]
    deps: []
    bead_count: 8
  - codename: w-iso-1
    areas: [iso-a]
    deps: []
    bead_count: 6
  - codename: w-iso-2
    areas: [iso-b]
    deps: []
    bead_count: 6
  - codename: w-iso-3
    areas: [iso-c]
    deps: []
    bead_count: 6
  - codename: w-iso-4
    areas: [iso-d]
    deps: []
    bead_count: 6
  # Add dependents so the `core` works rank highest by fan-out.
  - { codename: c1-dn, areas: [d1], deps: [w-core-1], bead_count: 2 }
  - { codename: c2-dn, areas: [d2], deps: [w-core-2], bead_count: 2 }
  - { codename: c3-dn, areas: [d3], deps: [w-core-3], bead_count: 2 }
  - { codename: c4-dn, areas: [d4], deps: [w-core-4], bead_count: 2 }

bead_arrivals:
  generator:
    rework_rate_per_tick: 0.0
    target_works: [w-core-1, w-core-2, w-core-3, w-core-4]

agent_model:
  duration:
    kind: lognormal
    median_ticks: 30
    sigma: 0.8
